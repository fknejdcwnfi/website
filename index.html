    <div id="root"><!--site-fallback--></div>
    <script id="site-parser-bootstrap">
      (function () {
        var video = document.getElementById('vermouth-poetic-bootstrap');
        if (!video) return;
        var group = document.getElementById('vermouth-poetic-entry');
        var preference = { matches: true };
        try { preference = window.matchMedia('(prefers-reduced-motion: reduce)') || preference; } catch (_) {}
        var params = new URLSearchParams(window.location.search);
        var fixed = params.get('t');
        var inspect = fixed !== null && fixed.trim() !== '' && Number.isFinite(Number(fixed));
        var archived = params.get('view') === 'portrait' || ['legacy', 'voxel'].includes(params.get('style'));
        var inViewport = true;
        var disposed = false;
        function ready() { if (!disposed) video.dataset.ready = 'true'; }
        function sync() {
          if (disposed) return;
          var enabled = false;
          try { enabled = localStorage.getItem('vermouth-motion-enabled') === 'true'; } catch (_) {}
          var allowed = !inspect && !archived && params.get('motion') !== 'original' && (!preference.matches || enabled);
          if (!allowed) {
            video.pause();
            if (video.hasAttribute('src')) { video.removeAttribute('src'); video.load(); }
            delete video.dataset.ready;
            if (group) { group.dataset.weather = 'hidden'; group.dataset.motion = 'paused'; }
          } else if (!document.hidden && inViewport) {
            if (group) {
              group.dataset.weather = params.get('atmosphere') === '0' || params.get('snow') === '0' ? 'hidden' : 'visible';
              group.dataset.motion = 'running';
            }
            video.muted = true;
            if (video.getAttribute('src') !== video.dataset.src) video.src = video.dataset.src;
            try {
              var playing = video.play();
              if (playing && playing.catch) playing.catch(function () {});
            } catch (_) {}
          } else {
            video.pause();
            if (group) group.dataset.motion = 'paused';
          }
        }
        var observer = null;
        try {
          if (typeof IntersectionObserver !== 'undefined') {
            observer = new IntersectionObserver(function (entries) {
              inViewport = entries[0] ? entries[0].isIntersecting : true;
              sync();
            });
            observer.observe(video.parentElement);
          }
        } catch (_) {
          try { if (observer) observer.disconnect(); } catch (_) {}
          observer = null;
        }
        var unlistenPreference = function () {};
        var preferenceListening = false;
        try {
          if (typeof preference.addEventListener === 'function') {
            preference.addEventListener('change', sync);
            preferenceListening = true;
            unlistenPreference = function () { try { preference.removeEventListener('change', sync); } catch (_) {} };
          }
        } catch (_) { try { preference.removeEventListener('change', sync); } catch (_) {} }
        try {
          if (!preferenceListening && typeof preference.addListener === 'function') {
            preference.addListener(sync);
            unlistenPreference = function () { try { preference.removeListener(sync); } catch (_) {} };
          }
        } catch (_) { try { preference.removeListener(sync); } catch (_) {} }
        video.addEventListener('loadeddata', ready);
        document.addEventListener('visibilitychange', sync);
        window.__vermouthPoeticVideo = video;
        window.__vermouthPoeticEntry = group;
        window.__vermouthPoeticCleanup = function () {
          disposed = true;
          try { if (observer) observer.disconnect(); } catch (_) {}
          video.removeEventListener('loadeddata', ready);
          unlistenPreference();
          document.removeEventListener('visibilitychange', sync);
        };
        sync();
      }());
    </script>
    <p id="site-startup-status" class="site-startup-status" role="status" hidden>
      页面加载较慢，你仍可浏览内容与场景预览。
      <button type="button" id="site-startup-reload">重新加载</button>

    <noscript><p class="site-startup-status">浏览器未启用 JavaScript，目前显示静态网站与肖像。</p></noscript>
    <script id="site-startup-watchdog">
      (function () {
        document.getElementById('site-startup-reload').addEventListener('click', function () { window.location.reload(); });
        var timer = window.setTimeout(function () {
          if (document.documentElement.getAttribute('data-site-module') !== 'ready') {
            document.getElementById('site-startup-status').hidden = false;
          }
        }, 12000);
        window.addEventListener('site-module-ready', function () {
          window.clearTimeout(timer);
          document.getElementById('site-startup-status').hidden = true;
        });
      }());
    </script>
