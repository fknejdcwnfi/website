  <body>
    <div id="root"><!--site-fallback--></div>
    <script>
      (function () {
        var video = document.getElementById('vermouth-bootstrap');
        if (!video) return;
        var query = window.matchMedia('(prefers-reduced-motion: reduce)');
        var params = new URLSearchParams(location.search);
        var quiet = params.has('t') || params.get('view') === 'portrait' || ['voxel', 'legacy'].indexOf(params.get('style')) !== -1;
        window.__vermouthBootVideo = video;
        function allowed() {
          var choice = false;
          try { choice = localStorage.getItem('vermouth-motion-enabled') === 'true'; } catch (e) {}
          return !quiet && (!query.matches || choice);
        }
        function sync() {
          if (!allowed()) {
            video.pause(); video.removeAttribute('src'); video.load(); delete video.dataset.ready;
          } else if (!document.hidden) {
            if (!video.getAttribute('src')) video.src = '%BASE_URL%assets/reference-scene/boot.mp4?v=__SCENE_BOOT_SHA__';
            video.muted = true;
            var started = video.play(); if (started && started.catch) started.catch(function () {});
          } else video.pause();
        }
        function ready() { video.dataset.ready = 'true'; }
        video.addEventListener('loadeddata', ready);
        query.addEventListener('change', sync);
        document.addEventListener('visibilitychange', sync);
        window.__vermouthBootCleanup = function () {
          query.removeEventListener('change', sync);
          document.removeEventListener('visibilitychange', sync);
          video.removeEventListener('loadeddata', ready);
        };
        sync();
      }());
    </script>
    <p id="site-startup-status" class="site-startup-status" role="status" hidden>
      互動功能尚未載入，目前顯示靜態網站與肖像。
      <button type="button" onclick="window.location.reload()">重新載入</button>
    </p>
    <noscript><p class="site-startup-status">瀏覽器未啟用 JavaScript，目前顯示靜態網站與肖像。</p></noscript>
    <script>
      (function () {
        var timer = window.setTimeout(function () {
          if (document.documentElement.getAttribute('data-site-module') !== 'ready') {
            document.getElementById('site-startup-status').hidden = false;
          }
        }, 12000);
        window.addEventListener('site-module-ready', function () {
          window.clearTimeout(timer);
          document.getElementById('site-startup-status').hidden = true;
        });
      }());
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
